name: Build & attach Jars

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-linux:
    name: Jar release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Assemble app
        run: |
          ./gradlew assemble

      - name: Rename jar
        run: |
          mkdir -p ".temp"
          mv "lib/build/libs/lib-1.0.0.jar" "./.temp/JJFXUtils.jar"

      - name: Upload Jar assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "./.temp/JJFXUtils.jar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}